name: Börsen-Watcher

on:
  schedule:
    # Zweimal pro Stunde (Minute 17 und 47, nicht zur vollen Stunde: dann ist GitHub
    # oft überlastet und lässt Läufe aus). Mo-Fr, 12-22 Uhr UTC.
    # Das Skript prüft die genaue Zeit und schickt das Markt-Update nur einmal pro Stunde.
    - cron: "17,47 12-22 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Auch außerhalb der Börsenzeit laufen (Test)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Watcher ausführen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
          PORTFOLIO_JSON: ${{ secrets.PORTFOLIO_JSON }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: python watcher.py
      - name: Daten zurückschreiben
        run: |
          if [ -n "$(git status --porcelain docs)" ]; then
            git config user.name "watcher-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A docs
            git commit -m "Daten aktualisiert"
            git pull --rebase
            git push
          fi
